[package]
name = "boolmesh"
version = "0.1.10"
edition = "2024"
description = "Robust 3D mesh boolean library"
rust-version = "1.87"
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/komietty/boolmesh"
homepage = "https://github.com/komietty/boolmesh"
authors = ["Saki Komikado <komietty@gmail.com>"]
keywords = ["mesh", "boolean", "csg", "geometry", "modeling"]
categories = ["algorithms", "mathematics", "graphics", "simulation", "game-development"]
exclude = ["/examples", ".gitignore"]

[dependencies]
glam  = "0.32.1"
rayon = { version = "1.12.0", optional = true }

tobj = {version = "4.0.3", optional = true}
bevy = { version = "0.18.1", optional = true }
bevy_panorbit_camera = { version = "0.34.0", optional = true }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3


[features]
default = []
verbose = []
f32 = []
rayon = ["dep:rayon"]

bevy = [
    "dep:tobj",
    "dep:bevy",
    "dep:bevy_panorbit_camera",
]

[[example]]
name = "menger_sponge"
path = "examples/menger_sponge.rs"
required-features = ["bevy"]

[[example]]
name = "multiple_models"
path = "examples/multiple_models.rs"
required-features = ["bevy"]
